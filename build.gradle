plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// Minecraft 26.1+ ships unobfuscated, so Loom needs no `mappings` dependency and uses the
// non-remapping plugin id above (`net.fabricmc.fabric-loom`, not `fabric-loom-remap`).
dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	// The 26.2 client targets Java 25 bytecode.
	it.options.release = 25
}

// Exports the jars this project compiles against, so a machine without access to Maven/Mojang
// can still run javac (see the provision-toolchain job in .github/workflows/build.yml).
// Filtered down to the jars that actually matter for compiling this mod, to keep the archive small.
tasks.register('exportCompileClasspath') {
	doLast {
		def outDir = file('compile-libs')
		delete outDir
		outDir.mkdirs()

		def wanted = ~/(?i).*(minecraft|fabric|gson|lwjgl|joml|annotations).*\.jar/
		def jars = sourceSets.main.compileClasspath.files.findAll {
			it.isFile() && it.name ==~ wanted
		}

		copy {
			from jars
			into outDir
		}
		println "Exported ${jars.size()} jars:"
		jars.each { println "  ${it.name} (${it.length() / 1024} KB)" }

	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build"
	// task if it is present.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
