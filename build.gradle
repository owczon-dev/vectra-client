plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

println "DEBUG fabric_version = [${project.fabric_version}]"
println "DEBUG notation = [net.fabricmc.fabric-api:fabric-api:${project.fabric_version}]"

// Minecraft 26.1+ ships unobfuscated, so Loom needs no `mappings` dependency and uses the
// non-remapping plugin id above (`net.fabricmc.fabric-loom`, not `fabric-loom-remap`).
dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	// The 26.2 client targets Java 25 bytecode.
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build"
	// task if it is present.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
