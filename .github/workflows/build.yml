name: Build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Minecraft 26.2 and this mod both target Java 25 bytecode.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: |
          set +e
          ./gradlew build --stacktrace > build.log 2>&1
          code=$?
          echo "----- build.log -----"
          cat build.log
          echo "---------------------"
          exit $code

      - name: Upload jar artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vectra-client
          path: build/libs/*.jar
          if-no-files-found: error

      # Publish the log and jar to a branch so they can be fetched with plain git.
      # "[skip ci]" keeps this push from triggering another run.
      - name: Publish CI output
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs
          mkdir -p ci
          [ -f build.log ] && cp build.log "ci/build-$GITHUB_RUN_NUMBER.log"
          if ls build/libs/*.jar > /dev/null 2>&1; then cp build/libs/*.jar ci/; fi
          git add ci/
          git commit -m "CI output for run $GITHUB_RUN_NUMBER [skip ci]" || echo "nothing to commit"
          git push --force origin ci-logs || echo "push failed"
